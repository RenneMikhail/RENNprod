<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENN Prod · Анимированный логотип</title><style>*{box-sizing:border-box}body{margin:0;background:#121416;color:#f5f1e9;font:16px/1.5 ui-monospace,monospace}main{max-width:800px;margin:auto;padding:24px}a{color:#ffad29;display:inline-flex;min-height:44px;align-items:center}h1 span{color:#ffad29;font-weight:400}.stage{background:#24282b;border:1px solid #41464a;border-radius:16px;display:grid;place-items:center;aspect-ratio:4/3;overflow:hidden}object{display:block;width:100%;height:100%;max-height:540px}.controls{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}button{font:inherit;padding:12px 18px;min-height:48px;cursor:pointer;border-radius:6px;border:1px solid #665136;background:#ffad29;color:#151515}button[aria-pressed=true]{background:#343a3d;color:#eee}button:focus-visible{outline:3px solid white;outline-offset:4px}.light{background:#f3f0e7}p{color:#b8bfc4}#state{min-height:24px}@media(max-width:480px){main{padding:16px}.stage{aspect-ratio:1}}</style></head><body><main><a href="../">← Рабочее пространство</a><h1>RENN <span>Prod</span></h1><div class="stage" id="stage"><object id="eye" type="image/svg+xml" data="renn-prod-eye-vector.svg?v=11ffe55c9c1e" aria-label="Анимированный глаз RENN Prod"><img src="renn-prod-eye-vector.svg?v=11ffe55c9c1e" alt="Логотип RENN Prod"></object></div><div class="controls"><button id="play" type="button" aria-pressed="false">Пауза</button><button id="repeat" type="button">Сначала</button><button id="background" type="button" aria-pressed="false">Светлый фон</button></div><p id="state" role="status">Загрузка анимации…</p></main><script>
const eye=document.querySelector('#eye'),play=document.querySelector('#play'),stage=document.querySelector('#stage'),status=document.querySelector('#state');let paused=false;
function animations(){return eye.contentDocument?.documentElement.getAnimations({subtree:true})||[]}
function ready(){const list=animations();paused=matchMedia('(prefers-reduced-motion:reduce)').matches;play.textContent=paused?'Воспроизвести':'Пауза';play.setAttribute('aria-pressed',String(paused));status.textContent=list.length?'Цикл 8 секунд · глаз, вращение и REC':'Системное уменьшение движения включено. Нажмите «Воспроизвести».'}
eye.addEventListener('load',ready);
function enableMotion(){const doc=eye.contentDocument;if(!doc)return;let style=doc.querySelector('#preview-motion');if(!style){style=doc.createElementNS('http://www.w3.org/2000/svg','style');style.id='preview-motion';style.textContent='.lid{animation:blink 8s infinite!important}.track{animation:gaze 8s infinite!important}.color{animation:record 8s infinite!important}.normal{animation:iris-detail 8s infinite!important}.identity{animation:identity 8s infinite!important}.lettering{animation:spin-stop 8s infinite cubic-bezier(.12,.75,.15,1)!important}.frame{animation:frame 8s infinite!important}.rec{animation:rec 8s infinite!important}.texture{animation:texture-fade 8s infinite!important}.iris-reflections{animation:reflection-drift 8s infinite!important}';doc.documentElement.append(style)}}
play.onclick=()=>{if(paused){if(!animations().length)enableMotion();animations().forEach(a=>a.play())}else animations().forEach(a=>a.pause());paused=!paused;play.textContent=paused?'Воспроизвести':'Пауза';play.setAttribute('aria-pressed',String(paused));status.textContent=paused?'Анимация на паузе':'Анимация воспроизводится'};
document.querySelector('#repeat').onclick=()=>{if(!animations().length)enableMotion();animations().forEach(a=>{a.currentTime=0;a.play()});paused=false;play.textContent='Пауза';play.setAttribute('aria-pressed','false');status.textContent='Анимация запущена сначала'};
document.querySelector('#background').onclick=e=>{const light=stage.classList.toggle('light');e.target.setAttribute('aria-pressed',String(light));e.target.textContent=light?'Тёмный фон':'Светлый фон'};
</script></body></html>
