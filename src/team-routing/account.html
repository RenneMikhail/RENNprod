<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENN Prod · Аккаунт</title>
<style>body{background:#101314;color:#eee;font:17px/1.5 system-ui;margin:auto;padding:24px;max-width:520px}a{color:#ffae29}h1{font-size:32px}form{border:1px solid #394044;padding:20px;border-radius:16px;margin:24px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:8px;margin:8px 0 18px}input{background:#191e20;color:#fff;border:1px solid #667074}button{background:#ffae29;color:#111;border:0;min-height:48px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.secondary{background:transparent;color:#eee;border:1px solid #667074}#status{min-height:3em;overflow-wrap:anywhere}</style>
<a id="back" href="/crm/">← Рабочая панель</a><h1>Мой аккаунт</h1><p id="identity"></p>
<form><h2>Сменить пароль</h2><label>Текущий пароль<input name="current_password" type="password" autocomplete="current-password" maxlength="1024" required></label><label>Новый пароль<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Повторите новый пароль<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><p>От 12 символов. После смены потребуется войти заново на всех устройствах.</p><button disabled>Сохранить пароль</button></form><button id="logout" class="secondary" disabled>Выйти из аккаунта</button><p id="status" role="status" aria-live="polite"></p>
<script>
const csrf='__SESSION__',form=document.querySelector('form'),status=document.querySelector('#status'),logout=document.querySelector('#logout');
async function request(path,body){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(10000),...(body?{method:'POST',headers:{'Content-Type':'application/json','X-Local-Session':csrf},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось выполнить запрос');return data}
request('/api/me').then(me=>{document.querySelector('#identity').textContent=me.username+' · '+({owner:'Владелец',manager:'Менеджер',employee:'Сотрудник'}[me.role]||'');document.querySelector('#back').href=me.role==='employee'?'/employee':'/crm/';form.querySelector('button').disabled=false;logout.disabled=false}).catch(e=>status.textContent=e.message);
form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.new_password!==data.confirm){status.textContent='Новые пароли не совпадают';return}delete data.confirm;const button=form.querySelector('button');button.disabled=true;try{const result=await request('/api/account/password',data);form.reset();status.textContent=result.message;location.assign('/login')}catch(e){status.textContent=e.message;button.disabled=false}};
logout.onclick=async()=>{logout.disabled=true;try{await request('/api/logout',{});location.assign('/login')}catch(e){status.textContent=e.message;logout.disabled=false}};
</script></html>
