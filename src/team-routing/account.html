<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENN Prod · Аккаунт</title>
<style>body{background:#101314;color:#eee;font:17px/1.5 system-ui;margin:auto;padding:24px;max-width:520px}a{color:#ffae29}h1{font-size:32px}form{border:1px solid #394044;padding:20px;border-radius:16px;margin:24px 0}input,textarea,select,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;border-radius:8px;margin:8px 0 18px}input,textarea,select{background:#191e20;color:#fff;border:1px solid #667074}button{background:#ffae29;color:#111;border:0;min-height:48px;cursor:pointer}button:disabled{opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.secondary{background:transparent;color:#eee;border:1px solid #667074}#status{min-height:3em;overflow-wrap:anywhere}</style>
<a id="back" href="/crm/">← Рабочая панель</a><h1>Мой аккаунт</h1><p id="identity"></p>
<form id="profile"><h2>Личная информация</h2><label>Имя<input name="display_name" maxlength="120" required autocomplete="name"></label><label>О себе<textarea name="bio" maxlength="2000" rows="4"></textarea></label><label>Telegram<input name="telegram" maxlength="100" placeholder="@username"></label><label>Почта<input name="email" type="email" maxlength="254" autocomplete="email"></label><label>Телефон<input name="phone" type="tel" maxlength="40" autocomplete="tel"></label><label>Как со мной связаться<select name="contact_preference"><option value="telegram">Писать в Telegram</option><option value="email">Писать на почту</option><option value="call">Можно звонить</option><option value="any">Любым способом</option></select></label><button disabled>Сохранить профиль</button><p id="profile-status" role="status" aria-live="polite"></p></form>
<section aria-labelledby="telegram-title"><h2 id="telegram-title">Связать Telegram</h2><p>Получите код и отправьте команду нашему боту в личном чате. Код действует 10 минут. Никому его не пересылайте.</p><button id="telegram-link" disabled>Получить код</button><button id="telegram-unlink" class="secondary" disabled>Отключить Telegram</button><p id="telegram-status" role="status" style="overflow-wrap:anywhere"></p></section><form id="password"><h2>Сменить пароль</h2><label>Текущий пароль<input name="current_password" type="password" autocomplete="current-password" maxlength="1024" required></label><label>Новый пароль<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><label>Повторите новый пароль<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required></label><p>От 12 символов. После смены потребуется войти заново на всех устройствах.</p><button disabled>Сохранить пароль</button></form><button id="logout" class="secondary" disabled>Выйти из аккаунта</button><p id="status" role="status" aria-live="polite"></p>
<script>
const csrf='__SESSION__',form=document.querySelector('#password'),status=document.querySelector('#status'),logout=document.querySelector('#logout');
async function request(path,body){const r=await fetch(path,{credentials:'same-origin',cache:'no-store',signal:AbortSignal.timeout(10000),...(body?{method:'POST',headers:{'Content-Type':'application/json','X-Local-Session':csrf},body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось выполнить запрос');return data}
request('/api/me').then(me=>{document.querySelector('#identity').textContent=me.username+' · '+({owner:'Владелец',manager:'Менеджер',employee:'Сотрудник'}[me.role]||'');document.querySelector('#back').href=me.role==='employee'?'/employee':'/crm/';form.querySelector('button').disabled=false;logout.disabled=false}).catch(e=>status.textContent=e.message);
const profileForm=document.querySelector('#profile'),profileStatus=document.querySelector('#profile-status');
request('/api/account/profile').then(data=>{for(const [key,value] of Object.entries(data)){const field=profileForm.elements.namedItem(key);if(field)field.value=value}profileForm.querySelector('button').disabled=false}).catch(e=>profileStatus.textContent=e.message);
profileForm.onsubmit=async e=>{e.preventDefault();const button=profileForm.querySelector('button');button.disabled=true;try{await request('/api/account/profile',Object.fromEntries(new FormData(profileForm)));profileStatus.textContent='Профиль сохранён'}catch(e){profileStatus.textContent=e.message}finally{button.disabled=false}};
form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));if(data.new_password!==data.confirm){status.textContent='Новые пароли не совпадают';return}delete data.confirm;const button=form.querySelector('button');button.disabled=true;try{const result=await request('/api/account/password',data);form.reset();status.textContent=result.message;location.assign('/login')}catch(e){status.textContent=e.message;button.disabled=false}};
const linkButton=document.querySelector('#telegram-link'),unlinkButton=document.querySelector('#telegram-unlink'),telegramStatus=document.querySelector('#telegram-status');
async function refreshTelegram(){const data=await request('/api/account/telegram');telegramStatus.textContent=data.linked?'Telegram подключён':'Telegram не подключён';linkButton.disabled=data.linked;unlinkButton.disabled=!data.linked}
refreshTelegram().catch(e=>telegramStatus.textContent=e.message);
linkButton.onclick=async()=>{linkButton.disabled=true;try{const data=await request('/api/account/telegram',{});telegramStatus.textContent=data.command+' · действует 10 минут. После отправки обновите страницу.'}catch(e){telegramStatus.textContent=e.message}finally{linkButton.disabled=false}};
unlinkButton.onclick=async()=>{unlinkButton.disabled=true;try{await request('/api/account/telegram/unlink',{});await refreshTelegram()}catch(e){telegramStatus.textContent=e.message;unlinkButton.disabled=false}};
logout.onclick=async()=>{logout.disabled=true;try{await request('/api/logout',{});location.assign('/login')}catch(e){status.textContent=e.message;logout.disabled=false}};
</script></html>
